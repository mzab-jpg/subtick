<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980">
  <rect width="1440" height="980" fill="#F8F7F4"/>
  <text x="80" y="86" fill="#111111" font-family="Georgia, serif" font-size="46" font-weight="700">Tangent — Direction Mark</text>
  <text x="80" y="125" fill="#666666" font-family="Arial, sans-serif" font-size="22">A flatter, editorial evolution of the existing blue upward-chevron icon.</text>
  <!-- App icon -->
  <text x="80" y="205" fill="#666666" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2">APP ICON</text>
  <rect x="80" y="235" width="300" height="300" rx="72" fill="#111111"/>
  <path d="M142 445 L230 300 L318 445" fill="none" stroke="#F8F7F4" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="230" cy="300" r="10" fill="#B63A3A"/>
  <!-- Splash -->
  <text x="515" y="205" fill="#666666" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2">STARTUP SCREEN</text>
  <rect x="515" y="235" width="420" height="560" rx="30" fill="#F8F7F4" stroke="#E8E5E1" stroke-width="3"/>
  <path d="M605 560 L725 360 L845 560" fill="none" stroke="#111111" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="725" cy="360" r="12" fill="#B63A3A"/>
  <text x="725" y="675" text-anchor="middle" fill="#111111" font-family="Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="9">TANGENT</text>
  <!-- Loader -->
  <text x="1065" y="205" fill="#666666" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2">LOADING MARK</text>
  <rect x="1065" y="235" width="295" height="220" rx="28" fill="#FFFFFF" stroke="#E8E5E1" stroke-width="3"/>
  <path d="M1160 392 L1210 306 L1260 392" fill="none" stroke="#111111" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1210" cy="306" r="7" fill="#B63A3A"/>
  <text x="1210" y="425" text-anchor="middle" fill="#666666" font-family="Arial, sans-serif" font-size="17">Point could gently pulse</text>
  <!-- Dark preview -->
  <text x="80" y="650" fill="#666666" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2">DARK MODE PREVIEW</text>
  <rect x="80" y="680" width="280" height="220" rx="50" fill="#121212"/>
  <path d="M140 842 L220 708 L300 842" fill="none" stroke="#F5F5F5" stroke-width="31" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="220" cy="708" r="8" fill="#C94B4B"/>
  <text x="410" y="735" fill="#111111" font-family="Georgia, serif" font-size="28" font-weight="700">Character</text>
  <text x="410" y="778" fill="#666666" font-family="Arial, sans-serif" font-size="23">Familiar, assertive, directional.</text>
  <text x="410" y="817" fill="#666666" font-family="Arial, sans-serif" font-size="23">Keeps the spirit of your current icon.</text>
</svg>
