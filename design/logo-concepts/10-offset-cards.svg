<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
<rect width="1600" height="1050" fill="#F8F7F4"/>
<text x="90" y="90" fill="#111111" font-family="Arial, sans-serif" font-size="50" font-weight="700">Offset Cards</text><text x="90" y="130" fill="#666666" font-family="Arial, sans-serif" font-size="23">A compact stream of selected things. The simplest direct link to Tangent’s product experience.</text>
<text x="90" y="210" fill="#666666" font-family="Arial" font-size="19" font-weight="700" letter-spacing="2">APP ICON — LARGE TEST</text>
<rect x="90" y="245" width="540" height="540" rx="130" fill="#F8F7F4" stroke="#111111" stroke-width="14"/>
<rect x="220" y="475" width="245" height="145" rx="22" fill="#D9D7D2"/><rect x="245" y="435" width="245" height="145" rx="22" fill="#888888"/><rect x="270" y="395" width="245" height="145" rx="22" fill="#111111"/>
<path d="M305 435 H430 M305 468 H395" stroke="#F8F7F4" stroke-width="15" stroke-linecap="round"/>
<text x="360" y="850" text-anchor="middle" fill="#111111" font-family="Arial" font-size="24" font-weight="700">The selected next thing rises to the front</text>
<text x="810" y="210" fill="#666666" font-family="Arial" font-size="19" font-weight="700" letter-spacing="2">STARTUP SCREEN</text>
<rect x="810" y="245" width="440" height="630" rx="34" fill="#F8F7F4" stroke="#E8E5E1" stroke-width="3"/>
<rect x="920" y="510" width="200" height="120" rx="18" fill="#D9D7D2"/><rect x="940" y="480" width="200" height="120" rx="18" fill="#888888"/><rect x="960" y="450" width="200" height="120" rx="18" fill="#111111"/><path d="M990 483 H1095 M990 512 H1065" stroke="#F8F7F4" stroke-width="12" stroke-linecap="round"/>
<text x="1030" y="745" text-anchor="middle" fill="#111111" font-family="Arial" font-size="33" font-weight="800" letter-spacing="9">TANGENT</text>
<text x="1330" y="210" fill="#666666" font-family="Arial" font-size="19" font-weight="700" letter-spacing="2">LOADER</text>
<rect x="1330" y="245" width="190" height="190" rx="32" fill="#FFFFFF" stroke="#E8E5E1" stroke-width="3"/><rect x="1370" y="350" width="85" height="52" rx="9" fill="#D9D7D2"/><rect x="1380" y="335" width="85" height="52" rx="9" fill="#888888"/><rect x="1390" y="320" width="85" height="52" rx="9" fill="#111111"/>
