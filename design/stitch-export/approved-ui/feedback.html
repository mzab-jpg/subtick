<style>
    /* Custom utility classes not directly supported by standard Tailwind classes */
    .border-steel-blue { border-color: #7FA8C9; }
    .text-steel-blue { color: #7FA8C9; }
    .bg-steel-blue { background-color: #7FA8C9; }
    
    /* Hide scrollbar for cleaner look */
    ::-webkit-scrollbar {
        width: 0px;
        background: transparent;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-surface h-screen w-full flex flex-col font-body-md overflow-hidden">
<!-- Top Bar -->
<header class="w-full h-16 flex items-center justify-between px-6 border-b border-border-subtle shrink-0">
<button aria-label="Close" class="text-on-surface-muted hover:text-on-surface transition-colors focus:outline-none">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
<h1 class="absolute left-1/2 -translate-x-1/2 font-headline-md text-headline-md font-bold uppercase tracking-[1px] text-on-surface">
      SEND FEEDBACK
    </h1>
<div class="w-6 h-6"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col w-full px-7 pt-stack-md pb-stack-lg gap-stack-lg overflow-y-auto">
<!-- Subtitle -->
<p class="text-body-md font-body-md text-on-surface-muted px-1 text-center sm:text-left">
      Bugs, ideas, or anything on your mind — we read everything.
    </p>
<!-- Form Area -->
<div class="flex flex-col gap-stack-lg w-full flex-1">
<!-- Text Area -->
<div class="relative w-full rounded-xl border border-border-subtle bg-surface focus-within:border-steel-blue transition-colors group">
<textarea class="w-full min-h-[160px] bg-transparent border-none rounded-xl p-4 text-[16px] text-on-surface placeholder:text-on-surface-faint font-body-md focus:ring-0 resize-none outline-none caret-[#7FA8C9]" placeholder="What's on your mind?" spellcheck="false"></textarea>
</div>
<!-- Submit Button -->
<button class="w-full h-[52px] rounded-lg border border-steel-blue bg-transparent flex items-center justify-center gap-2 hover:bg-accent-soft active:scale-[0.98] transition-all focus:outline-none">
<span class="material-symbols-outlined text-steel-blue text-[18px]">send</span>
<span class="font-label-mono text-[12px] font-bold uppercase tracking-[1px] text-steel-blue">SEND FEEDBACK</span>
</button>
</div>
</main>
<script>
    // Focus the textarea on load for immediate interaction
    document.addEventListener('DOMContentLoaded', () => {
      const textarea = document.querySelector('textarea');
      if (textarea) {
        setTimeout(() => textarea.focus(), 100);
      }
    });
  </script>
</body></html>
