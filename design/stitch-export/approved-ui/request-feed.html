<body class="bg-background text-primary antialiased min-h-screen flex flex-col font-body-md">
<!-- TopAppBar -->
<header class="bg-background border-b border-border-subtle docked full-width top-0 flex items-center justify-between px-margin-page h-16 w-full z-50">
<button aria-label="Close" class="text-on-surface-muted hover:opacity-80 transition-opacity active:scale-95 transition-transform flex items-center justify-center p-2 -ml-2">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-title-sm text-primary font-bold custom-title">Request a Feed</h1>
<div class="w-8"></div> <!-- Spacer for centering -->
</header>
<main class="flex-1 flex flex-col pt-stack-lg pb-margin-page">
<!-- Subtitle -->
<p class="text-on-surface-muted px-margin-subtitle mb-stack-lg">
            Submit a Substack publication you'd like us to add to the feed directory.
        </p>
<!-- Form -->
<form action="#" class="flex-1 flex flex-col px-margin-page" method="POST">
<!-- Field 1: Publication URL -->
<div class="flex flex-col mb-stack-lg">
<label class="font-semibold text-primary custom-label mb-stack-sm" for="publication-url">Publication URL</label>
<input class="bg-surface border border-border-subtle rounded-input px-gutter py-3 text-[16px] text-primary placeholder-on-surface-faint focus:border-accent-blue focus:ring-0 custom-input transition-colors" id="publication-url" name="publication-url" placeholder="https://example.substack.com/feed" required="" type="url"/>
</div>
<!-- Field 2: Why recommend -->
<div class="flex flex-col mb-stack-lg">
<label class="font-semibold text-primary custom-label mb-stack-sm" for="recommendation-reason">Why do you recommend this?</label>
<textarea class="bg-surface border border-border-subtle rounded-input px-gutter py-4 text-[16px] text-primary placeholder-on-surface-faint focus:border-accent-blue focus:ring-0 custom-textarea transition-colors resize-none" id="recommendation-reason" name="recommendation-reason" placeholder="Optional — tell us why this publication would be a great addition."></textarea>
</div>
<div class="mt-auto pt-stack-lg">
<!-- Submit Button -->
<button class="w-full h-[52px] bg-transparent border border-accent-blue rounded flex items-center justify-center gap-2 hover:bg-accent-soft transition-colors active:scale-[0.98]" type="submit">
<span class="material-symbols-outlined text-accent-blue text-[16px]" data-icon="rss_feed">rss_feed</span>
<span class="font-label-mono font-bold custom-button-label text-accent-blue uppercase tracking-wider mt-[2px]">Submit Request</span>
</button>
</div>
</form>
</main>
</body></html>
