<body class="bg-background text-on-surface antialiased overflow-hidden selection:bg-secondary/30">
<div class="relative h-[100dvh] w-full mx-auto max-w-[480px] sm:max-w-none md:max-w-[400px] md:h-[850px] md:my-10 md:rounded-3xl md:border md:border-border-subtle md:shadow-2xl overflow-hidden bg-background">
<!-- Background Imagery -->
<img class="absolute inset-0 h-full w-full object-cover saturate-[.85] brightness-90 z-0" data-alt="A breathtaking aerial view of a deep alpine valley under a dramatic, cloudy sky. A sleek, futuristic red VTOL aircraft flies low over the lush green landscape. Scattered modern, dark-wood cabins dot the rocky terrain below. The lighting is cinematic, with shafts of sunlight piercing through the moody clouds, highlighting the natural greens, warm rock tones, and deep blue skies." src="https://lh3.googleusercontent.com/aida/AEtjO1Ut-kJCaYWO3bamqsvRsplJiMKp_dOL21-uWYIL2LacklZbmgQh_tnlmfwH8dd68IKWeePPdN7EAWB3N8oE6rd-AzFbNY2AY0NM5DgF2SNf46gBjOPbmk51AtLjxYTA31OF2RVKAshQApX-EWbuXCqWJg6Le23FUptZ3w1wmusfeGwCal0dG5JT7Q0jMHzK25pkhDUi8jtcgj-Ttp3hc8_-vYxa8x01WJ73B8WNYr-cgcOkL4-nMMIOdnc"/>
<!-- Top Scrim -->
<div class="absolute inset-x-0 top-0 h-[20%] bg-gradient-to-b from-black/60 to-transparent pointer-events-none z-0"></div>
<!-- Bottom-Left Wedge Scrim -->
<div class="absolute bottom-0 left-0 w-[65%] h-[50%] bg-gradient-to-r from-background/[0.92] via-background/[0.45] to-transparent pointer-events-none z-0"></div>
<!-- Header -->
<header class="fixed md:absolute top-0 w-full z-50 flex justify-between items-center px-margin-page h-16 pt-safe">
<div class="font-display-lg text-[18px] text-primary tracking-tight text-shadow-subtle">Tangent</div>
<button class="flex items-center justify-center p-1 rounded-full hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-[22px] text-primary text-shadow-subtle" style='font-variation-settings: "FILL" 0;'>account_circle</span>
</button>
</header>
<!-- Main Content Overlay -->
<main class="absolute bottom-[104px] left-0 w-full md:w-[90%] px-margin-page z-10 flex flex-col items-start pb-stack-sm">
<div class="font-label-mono text-label-mono uppercase text-primary text-shadow-subtle mb-stack-sm tracking-widest">
                NOT BORING · 18 MIN READ
            </div>
<h1 class="font-display-lg text-display-lg text-primary text-shadow-heavy mb-stack-md leading-tight line-clamp-2 pr-12">
                Expanding the Radius of Daily Life
            </h1>
<blockquote class="font-body-md text-[17px] italic text-[#E2E5EB] border-l-[3px] border-secondary pl-3 py-0.5 mb-stack-md max-w-[85%] text-shadow-subtle">
                "A flying car is really a vehicle that flies point-to-point with car-like convenience."
            </blockquote>
<div class="font-label-mono text-label-mono uppercase tracking-widest mb-stack-lg">
<span class="text-primary text-shadow-subtle">PACKY McCORMICK · TSUNG XU</span>
<span class="text-on-surface-muted ml-1">· JUN 8</span>
</div>
<!-- Action Row -->
<div class="flex items-center gap-gutter w-full max-w-[340px]">
<button class="h-12 w-12 flex-shrink-0 flex items-center justify-center bg-surface-raised border border-border-strong rounded-DEFAULT active:scale-95 transition-transform" id="bookmark-btn">
<span class="material-symbols-outlined text-secondary transition-colors" style='font-variation-settings: "FILL" 0;'>bookmark</span>
</button>
<button class="flex-grow h-12 flex items-center justify-center bg-primary text-background font-label-mono text-[13px] font-bold uppercase rounded-DEFAULT active:scale-95 transition-transform tracking-wider" id="read-btn">
                    READ ESSAY <span class="material-symbols-outlined text-[16px] ml-2">arrow_forward</span>
</button>
</div>
</main>
<nav class="bg-background/92 dark:bg-background/92 backdrop-blur-xl absolute md:absolute bottom-0 w-full z-50 pb-safe border-t border-border-subtle flex justify-around items-center h-20 px-gutter">
<!-- Active Tab: Feed -->
<button class="flex flex-col items-center justify-center gap-1 w-16 group active:translate-y-0.5 transition-transform">
<span class="material-symbols-outlined text-secondary" style='font-variation-settings: "FILL" 1;'>view_carousel</span>
<span class="font-label-mono text-[9px] uppercase text-primary tracking-widest">Feed</span>
<div class="w-1 h-1 rounded-full bg-secondary mt-0.5"></div>
</button>
<!-- Inactive Tab: Stacks -->
<button class="flex flex-col items-center justify-center text-on-surface-muted gap-1 w-16 group hover:text-primary transition-colors active:translate-y-0.5">
<span class="material-symbols-outlined text-[#8E9194] group-hover:text-primary transition-colors" style='font-variation-settings: "FILL" 0;'>layers</span>
<span class="font-label-mono text-[9px] uppercase text-[#8E9194] group-hover:text-primary transition-colors tracking-widest">Stacks</span>
</button>
<!-- Inactive Tab: Tuning -->
<button class="flex flex-col items-center justify-center text-on-surface-muted gap-1 w-16 group hover:text-primary transition-colors active:translate-y-0.5">
<span class="material-symbols-outlined text-[#8E9194] group-hover:text-primary transition-colors" style='font-variation-settings: "FILL" 0;'>tune</span>
<span class="font-label-mono text-[9px] uppercase text-[#8E9194] group-hover:text-primary transition-colors tracking-widest">Tuning</span>
</button>

<!-- Save-to-Stack Sheet -->
<div id="sheet-scrim" class="absolute inset-0 z-[70] bg-[#0C0E12]/60 backdrop-blur-[6px] transition-opacity duration-300" style="opacity:0;pointer-events:none;"></div>
<div id="save-sheet" class="absolute inset-x-0 bottom-20 z-[80] transition-all duration-300 ease-out" style="opacity:0;transform:translateY(16px);pointer-events:none;">
  <div class="mx-3 bg-surface-card border border-border-subtle rounded-t-xl overflow-hidden">
    <div class="flex items-center justify-between px-5 pt-4 pb-2">
      <span class="font-label-mono text-[10px] uppercase text-on-surface-faint" style="letter-spacing:1.2px;">Save to Stack</span>
      <button id="close-sheet-btn" class="p-1 -mr-1 text-on-surface-muted hover:text-primary transition-colors" aria-label="Close">
        <span class="material-symbols-outlined text-[20px]">close</span>
      </button>
    </div>
    <div class="px-5 pb-3 font-label-mono text-[10px] text-on-surface-muted tracking-widest uppercase truncate">
      Expanding the Radius of Daily Life <span class="text-on-surface-faint">&middot; 18 min</span>
    </div>
    <div id="stack-list" class="border-t border-b border-border-subtle"></div>
    <button id="new-stack-btn" class="flex items-center gap-1.5 px-5 py-3 text-[#7FA8C9] hover:text-white transition-colors">
      <span class="material-symbols-outlined text-[16px]">add</span>
      <span class="font-body-md text-[13px] font-medium">New Stack</span>
    </button>
    <div class="px-5 pb-5 pt-1">
      <button id="save-stack-btn" class="w-full h-[52px] flex items-center justify-center gap-2 border border-[#7FA8C9] text-[#7FA8C9] rounded-lg hover:bg-accent-soft active:scale-[0.98] transition-all font-label-mono text-[12px] font-bold uppercase tracking-wider">
        <span class="material-symbols-outlined text-[18px]">check</span>
        Save to Stack
      </button>
    </div>
  </div>
</div>
<div id="toast" class="absolute bottom-[96px] left-1/2 z-[90] bg-surface-card border border-border-subtle rounded px-4 py-2.5 font-label-mono text-[10px] uppercase tracking-widest text-primary transition-all duration-300 flex items-center gap-2 whitespace-nowrap" style="opacity:0;transform:translate(-50%,8px);pointer-events:none;">
  <span class="w-1.5 h-1.5 rounded-full bg-[#7FA8C9] flex-shrink-0"></span>
  <span id="toast-text">Saved to Quick Queue</span>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const bookmarkBtn = document.getElementById('bookmark-btn');
    const bookmarkIcon = bookmarkBtn.querySelector('.material-symbols-outlined');
    const scrim = document.getElementById('sheet-scrim');
    const sheet = document.getElementById('save-sheet');
    const list = document.getElementById('stack-list');
    const toast = document.getElementById('toast');
    const toastText = document.getElementById('toast-text');
    let selectedName = 'Quick Queue';
    let toastTimer = null;

    function addRow(name, hint, icon, selected) {
      const row = document.createElement('button');
      row.className = 'stack-row flex items-center gap-3 px-5 py-3.5 w-full text-left transition-colors border-b border-border-subtle';
      row.setAttribute('data-name', name);
      row.innerHTML =
        '<span class="material-symbols-outlined text-[18px] text-on-surface-muted row-icon">' + icon + '</span>' +
        '<span class="flex flex-col flex-1 min-w-0">' +
          '<span class="font-body-md text-[15px] font-medium text-primary truncate">' + name + '</span>' +
          '<span class="font-label-mono text-[10px] text-on-surface-faint mt-0.5 uppercase tracking-wider">' + hint + '</span>' +
        '</span>' +
        '<span class="material-symbols-outlined text-[18px] text-[#7FA8C9] row-check" style="opacity:0;">check</span>';
      row.addEventListener('click', () => selectRow(row));
      list.appendChild(row);
      if (selected) selectRow(row);
      return row;
    }

    function selectRow(row) {
      list.querySelectorAll('.stack-row').forEach(r => {
        const on = r === row;
        r.style.background = on ? 'rgba(127,168,201,0.12)' : '';
        r.querySelector('.row-check').style.opacity = on ? '1' : '0';
        r.querySelector('.row-icon').style.color = on ? '#7FA8C9' : '';
      });
      selectedName = row.getAttribute('data-name');
    }

    function openSheet() {
      scrim.style.opacity = '1';
      scrim.style.pointerEvents = 'auto';
      sheet.style.opacity = '1';
      sheet.style.transform = 'translateY(0)';
      sheet.style.pointerEvents = 'auto';
    }

    function closeSheet() {
      scrim.style.opacity = '0';
      scrim.style.pointerEvents = 'none';
      sheet.style.opacity = '0';
      sheet.style.transform = 'translateY(16px)';
      sheet.style.pointerEvents = 'none';
    }

    addRow('Quick Queue', 'Unread catch-all', 'bolt', true);
    addRow('Sunday Longform', 'Weekly edition', 'auto_stories', false);
    addRow('Tech & Frontier', 'Hard science', 'science', false);

    bookmarkBtn.addEventListener('click', () => {
      if (sheet.style.pointerEvents === 'auto') { closeSheet(); } else { openSheet(); }
    });
    document.getElementById('close-sheet-btn').addEventListener('click', closeSheet);
    scrim.addEventListener('click', closeSheet);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

    document.getElementById('new-stack-btn').addEventListener('click', () => {
      const n = list.querySelectorAll('.stack-row').length + 1;
      const row = addRow('New Stack ' + n, 'Untitled', 'layers', true);
      row.scrollIntoView({ block: 'nearest' });
    });

    document.getElementById('save-stack-btn').addEventListener('click', () => {
      closeSheet();
      bookmarkIcon.style.fontVariationSettings = "'FILL' 1";
      bookmarkIcon.style.color = '#7FA8C9';
      toastText.textContent = 'Saved to ' + selectedName;
      toast.style.opacity = '1';
      toast.style.transform = 'translate(-50%,0)';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translate(-50%,8px)';
      }, 2200);
    });
  });
</script>

</div>

</body></html>
