<!-- Save-to-Stack Sheet -->
<div id="sheet-scrim" class="absolute inset-0 z-[70] bg-[#0C0E12]/60 backdrop-blur-[6px] transition-opacity duration-300" style="opacity:0;pointer-events:none;"></div>
<div id="save-sheet" class="absolute inset-x-0 bottom-20 z-[80] transition-all duration-300 ease-out" style="opacity:0;transform:translateY(16px);pointer-events:none;">
  <div class="mx-3 bg-surface-card border border-border-subtle rounded-t-xl overflow-hidden">
    <div class="flex items-center justify-between px-5 pt-4 pb-2">
      <span class="font-label-mono text-[10px] uppercase text-on-surface-faint" style="letter-spacing:1.2px;">Save to Stack</span>
      <button id="close-sheet-btn" class="p-1 -mr-1 text-on-surface-muted hover:text-primary transition-colors" aria-label="Close">
        <span class="material-symbols-outlined text-[20px]">close</span>
      </button>
    </div>
    <div class="px-5 pb-3 font-label-mono text-[10px] text-on-surface-muted tracking-widest uppercase truncate">
      Expanding the Radius of Daily Life <span class="text-on-surface-faint">&middot; 18 min</span>
    </div>
    <div id="stack-list" class="border-t border-b border-border-subtle"></div>
    <button id="new-stack-btn" class="flex items-center gap-1.5 px-5 py-3 text-[#7FA8C9] hover:text-white transition-colors">
      <span class="material-symbols-outlined text-[16px]">add</span>
      <span class="font-body-md text-[13px] font-medium">New Stack</span>
    </button>
    <div class="px-5 pb-5 pt-1">
      <button id="save-stack-btn" class="w-full h-[52px] flex items-center justify-center gap-2 border border-[#7FA8C9] text-[#7FA8C9] rounded-lg hover:bg-accent-soft active:scale-[0.98] transition-all font-label-mono text-[12px] font-bold uppercase tracking-wider">
        <span class="material-symbols-outlined text-[18px]">check</span>
        Save to Stack
      </button>
    </div>
  </div>
</div>
<div id="toast" class="absolute bottom-[96px] left-1/2 z-[90] bg-surface-card border border-border-subtle rounded px-4 py-2.5 font-label-mono text-[10px] uppercase tracking-widest text-primary transition-all duration-300 flex items-center gap-2 whitespace-nowrap" style="opacity:0;transform:translate(-50%,8px);pointer-events:none;">
  <span class="w-1.5 h-1.5 rounded-full bg-[#7FA8C9] flex-shrink-0"></span>
  <span id="toast-text">Saved to Quick Queue</span>
</div>
